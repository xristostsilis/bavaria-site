alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
domains:
- domain: bavaria.com.gr
  type: PRIMARY
  zone: bavaria.com.gr
- domain: www.bavaria.com.gr
  type: ALIAS
  zone: bavaria.com.gr
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - match:
      authority:
        exact: www.bavaria.com.gr
      path:
        prefix: /
    redirect:
      authority: bavaria.com.gr
      redirect_code: 301
  - match:
      path:
        prefix: /main/en/content/contact
    redirect:
      uri: /epikoinonia/
      redirect_code: 301
  - match:
      path:
        prefix: /main/el/content/%CE%B5%CF%80%CE%B9%CE%BA%CE%BF%CE%B9%CE%BD%CF%89%CE%BD%CE%B9%CE%B1
    redirect:
      uri: /epikoinonia/
      redirect_code: 301
  - match:
      path:
        prefix: /main/el/content/%CF%83%CF%85%CE%BB%CE%BB%CE%B5%CE%BA%CF%84%CE%B5%CF%82
    redirect:
      uri: /proionta/
      redirect_code: 301
  - match:
      path:
        prefix: /main
    redirect:
      uri: /
      redirect_code: 301
  - match:
      path:
        prefix: /index.html
    redirect:
      uri: /
      redirect_code: 301
  - match:
      path:
        prefix: /img/
    redirect:
      uri: /proionta/
      redirect_code: 301
  - component:
      name: bavaria
    match:
      path:
        prefix: /
name: bavaria
region: fra
static_sites:
- environment_slug: html
  github:
    branch: main
    deploy_on_push: true
    repo: xristostsilis/bavaria-site
  name: bavaria
  source_dir: public
  index_document: index.html
  error_document: 404.html
